<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Futuro</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📈</text></svg>">
<style>
  :root{
    --bg:#f6f7fb; --card:#fff; --ink:#131a27; --dim:#68738a; --line:#e4e8f0;
    --liq:#3b82f6; --iliq:#a78bfa; --good:#0f9d58; --bad:#dc2626; --warn:#d97706;
    --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0f1420; --card:#171e2e; --ink:#e8ecf4; --dim:#8b97b0; --line:#26304a;
           --shadow:0 1px 3px rgba(0,0,0,.4); }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;
    padding:max(12px,env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom));
    max-width:560px;margin-inline:auto;-webkit-text-size-adjust:100%}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
  h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
  .scen{font-size:12px;color:var(--dim);max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
  .verdict{font-size:22px;font-weight:750;letter-spacing:-.02em;margin:0 0 2px}
  .verdict.ok{color:var(--good)} .verdict.bad{color:var(--bad)} .verdict.warn{color:var(--warn)}
  .sub{font-size:13px;color:var(--dim);margin:0}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;
    border-top:1px solid var(--line);padding-top:12px}
  /* fixed height keeps the three values on one baseline even if a label wraps */
  .k{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);
     margin-bottom:3px;min-height:2.4em;display:flex;align-items:flex-start}
  .v{font-size:16px;font-weight:700;letter-spacing:-.01em}
  svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
  .lg{display:flex;gap:14px;font-size:11px;color:var(--dim);margin-top:8px;align-items:center;flex-wrap:wrap}
  .dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
  .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
  .row label{font-size:13px;font-weight:600}
  .row .val{font-size:13px;font-weight:700}
  input[type=range]{width:100%;margin:0 0 16px;accent-color:var(--liq);height:26px}
  .sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;
    border-top:1px solid var(--line)}
  .sw:first-child{border-top:none}
  .sw span{font-size:13px;font-weight:600}
  .sw small{display:block;font-weight:400;color:var(--dim);font-size:11px;margin-top:1px}
  input[type=checkbox]{width:1.35em;height:1.35em;accent-color:var(--liq);flex-shrink:0}
  button{font:inherit;font-size:13px;font-weight:600;padding:11px 14px;border-radius:10px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;width:100%}
  button.p{background:var(--liq);border-color:var(--liq);color:#fff}
  button:active{transform:scale(.985)}
  .msg{font-size:12px;color:var(--dim);margin-top:8px;text-align:center;min-height:1.2em}
  .note{font-size:12px;color:var(--dim);line-height:1.5}
  .err{color:var(--bad)}
  iframe{position:absolute;width:0;height:0;border:0;opacity:0;pointer-events:none;left:-9999px}
  .sk{opacity:.45;transition:opacity .15s}
</style>
</head>
<body>

<header>
  <h1>Futuro</h1>
  <div class="scen mono" id="scen">loading…</div>
</header>

<div class="card" id="head">
  <p class="verdict" id="verdict">Starting engine…</p>
  <p class="sub" id="sub">Reusing the desktop simulation.</p>
  <div class="grid">
    <div><div class="k">Net worth<br>at end</div><div class="v mono" id="kNW">—</div></div>
    <div><div class="k">Lowest<br>cash</div><div class="v mono" id="kMin">—</div></div>
    <div><div class="k">Market<br>success</div><div class="v mono" id="kMC">—</div></div>
  </div>
</div>

<div class="card">
  <svg id="chart" viewBox="0 0 320 150" preserveAspectRatio="none" aria-label="Net worth projection"></svg>
  <div class="lg">
    <span><i class="dot" style="background:var(--liq)"></i>Cash &amp; investments</span>
    <span><i class="dot" style="background:var(--iliq)"></i>Property</span>
    <span id="hover" class="mono"></span>
  </div>
</div>

<div class="card" id="ctrl">
  <div class="row"><label for="sp">Monthly spending</label><span class="val mono" id="spV">—</span></div>
  <input type="range" id="sp" min="2000" max="25000" step="250">

  <div class="row"><label for="yr">Market return</label><span class="val mono" id="yrV">—</span></div>
  <input type="range" id="yr" min="0" max="14" step="0.25">

  <div class="row"><label for="inf">Inflation</label><span class="val mono" id="infV">—</span></div>
  <input type="range" id="inf" min="0" max="8" step="0.25">

  <div class="row"><label for="ea">Plan until age</label><span class="val mono" id="eaV">—</span></div>
  <input type="range" id="ea" min="70" max="100" step="1">

  <div class="sw">
    <span>Median outcome<small>Half of real results land below the average line</small></span>
    <input type="checkbox" id="med">
  </div>
  <div class="sw">
    <span>Sale costs &amp; property tax<small>8% per sale, 0.5%/yr carrying cost</small></span>
    <input type="checkbox" id="cost">
  </div>
</div>

<div class="card">
  <button id="reset">Reset to saved scenario</button>
  <div style="height:8px"></div>
  <button id="link" class="p">Copy link for another device</button>
  <div class="msg" id="msg"></div>
</div>

<p class="note" id="src"></p>

<iframe id="engine" src="index.html?engineonly=1" title="engine"></iframe>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const fmt = v => (v < 0 ? '−' : '') + '$' + (Math.abs(v) >= 1e6
    ? (Math.abs(v) / 1e6).toFixed(Math.abs(v) >= 1e7 ? 1 : 2) + 'M'
    : Math.round(Math.abs(v) / 1000) + 'k');

  // ── scenario transfer: gzip+base64url in the URL hash, so nothing touches a server ──
  const b64 = {
    enc: buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
    dec: s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0)),
  };
  async function pack(obj) {
    const bytes = new TextEncoder().encode(JSON.stringify(obj));
    if (!window.CompressionStream) return 'r' + b64.enc(bytes);
    const cs = new CompressionStream('gzip');
    const w = cs.writable.getWriter(); w.write(bytes); w.close();
    return 'z' + b64.enc(await new Response(cs.readable).arrayBuffer());
  }
  async function unpack(str) {
    const kind = str[0], bytes = b64.dec(str.slice(1));
    if (kind === 'r') return JSON.parse(new TextDecoder().decode(bytes));
    const ds = new DecompressionStream('gzip');
    const w = ds.writable.getWriter(); w.write(bytes); w.close();
    return JSON.parse(await new Response(ds.readable).text());
  }

  // ── engine bridge: index.html?engineonly=1 in a hidden iframe ──
  const frame = $('engine');
  let win = null;
  const ready = new Promise((res, rej) => {
    const t0 = Date.now();
    const poll = () => {
      try {
        if (frame.contentWindow && frame.contentWindow._engineReady) { win = frame.contentWindow; return res(); }
      } catch (e) { return rej(new Error('blocked: ' + e.message)); }
      if (Date.now() - t0 > 15000) return rej(new Error('engine did not start'));
      setTimeout(poll, 60);
    };
    frame.addEventListener('load', poll);
    poll();
  });

  // Runs inside the engine frame's scope, where S / runSim / ensureFields live.
  function simulate(scenario, withMC) {
    return win.eval(`(() => {
      S = ${JSON.stringify(scenario)};
      ensureFields();
      const d = runSim();
      const last = d[d.length - 1];
      let ruin = null;
      for (const m of d.monthly) if (m.liq < 0) { ruin = m.age; break; }
      let mc = null;
      ${withMC ? 'try { mc = runMonteCarlo(150).successRate; } catch (e) {}' : ''}
      return JSON.stringify({
        series: d.map(r => ({ age: r.age, liq: r.liq, iliq: r.iliq })),
        finalNW: last.liq + last.iliq, minLiq: d.simMinLiq, minAge: d.simMinAge,
        ruin, mc, startAge: S.startAge, endAge: S.endAge,
      });
    })()`);
  }

  // ── scenario sources, best first ──
  let saved = null, source = '';
  async function loadScenario() {
    const h = location.hash.match(/[#&]s=([^&]+)/);
    if (h) {
      try { saved = await unpack(decodeURIComponent(h[1])); source = 'shared link'; return; }
      catch (e) { console.warn('hash decode failed', e); }
    }
    try {
      const raw = localStorage.getItem('futuro_scenarios');
      if (raw) {
        const p = JSON.parse(raw);
        const list = p.scenarios || p;
        const act = list.find(s => s.id === p.activeId) || list[list.length - 1];
        if (act) { saved = act.data || act; source = 'this device' + (act.name ? ' — ' + act.name : ''); return; }
      }
    } catch (e) { console.warn('localStorage read failed', e); }
    saved = JSON.parse(win.eval('JSON.stringify(EMPTY)'));
    source = 'built-in example (no saved data found on this device)';
  }

  // ── live state ──
  let cur = null;
  const eff = s => Math.round((s.monthlyExpenses || 0) * (s.expMultiplier || 1));

  function readControls() {
    const s = JSON.parse(JSON.stringify(saved));
    s.monthlyExpenses = +$('sp').value;
    s.expMultiplier = 1;              // slider is the effective figure, so fold the multiplier in
    s.expenseCurve = {};              // a baked curve would override the slider
    s.yieldRate = +$('yr').value;
    s.yieldCurve = {};                // flat assumption: the slider is the whole story here
    s.inflationRate = +$('inf').value;
    s.endAge = +$('ea').value;
    s.useMedianReturn = $('med').checked;
    if ($('cost').checked) { s.sellCostRate = 8; s.propertyTaxRate = 0.5; }
    else { s.sellCostRate = 0; s.propertyTaxRate = 0; }
    (s.properties || []).forEach(p => { if (p.saleAge > s.endAge) { p.saleAge = s.endAge; p.hold = true; } });
    return s;
  }

  function syncLabels() {
    $('spV').textContent = '$' + (+$('sp').value).toLocaleString() + '/mo';
    $('yrV').textContent = (+$('yr').value).toFixed(2).replace(/\.?0+$/, '') + '%';
    $('infV').textContent = (+$('inf').value).toFixed(2).replace(/\.?0+$/, '') + '%';
    $('eaV').textContent = $('ea').value;
  }

  let mcTimer = null, seq = 0;
  function render(withMC) {
    syncLabels();
    const mine = ++seq;
    let r;
    try { r = JSON.parse(simulate(readControls(), withMC)); }
    catch (e) { fail('Simulation failed', e.message); return; }
    if (mine !== seq) return;
    cur = r;
    paint(r, withMC);
    if (!withMC) {
      clearTimeout(mcTimer);
      mcTimer = setTimeout(() => render(true), 400);   // MC is slow — only when sliders settle
    }
  }

  function paint(r, withMC) {
    const v = $('verdict'), sub = $('sub');
    if (r.ruin) {
      v.className = 'verdict bad';
      v.textContent = 'Runs out at ' + r.ruin;
      sub.textContent = 'Cash goes negative — the plan needs less spending, a later end, or an earlier sale.';
    } else if (r.mc != null && r.mc < 75) {
      v.className = 'verdict warn';
      v.textContent = 'Tight but holds';
      sub.textContent = 'Survives the main projection, but a meaningful share of market paths do not.';
    } else {
      v.className = 'verdict ok';
      v.textContent = 'Money lasts to ' + r.endAge;
      sub.textContent = 'Cash never runs out across the whole plan.';
    }
    $('kNW').textContent = fmt(r.finalNW);
    $('kMin').textContent = fmt(r.minLiq);
    $('kMin').style.color = r.minLiq < 0 ? 'var(--bad)' : '';
    $('kMC').textContent = r.mc == null ? '…' : r.mc + '%';
    $('kMC').classList.toggle('sk', !withMC && r.mc == null);
    chart(r.series);
  }

  function fail(title, detail) {
    $('verdict').className = 'verdict bad';
    $('verdict').textContent = title;
    $('sub').textContent = detail || '';
  }

  // ── stacked area chart, hand-rolled SVG (no chart library to ship to a phone) ──
  const W = 320, H = 150;
  function chart(series) {
    if (!series || series.length < 2) return;
    const xs = series.map(d => d.age);
    const tops = series.map(d => Math.max(d.liq, 0) + Math.max(d.iliq, 0));
    const lows = series.map(d => Math.min(d.liq, 0));
    const hi = Math.max(...tops, 1), lo = Math.min(...lows, 0);
    const x = a => (a - xs[0]) / Math.max(xs[xs.length - 1] - xs[0], 1) * W;
    const y = v => H - (v - lo) / Math.max(hi - lo, 1) * H;
    const area = (get, base) => {
      const up = series.map((d, i) => `${i ? 'L' : 'M'}${x(d.age).toFixed(1)},${y(get(d)).toFixed(1)}`).join('');
      const dn = series.slice().reverse().map(d => `L${x(d.age).toFixed(1)},${y(base(d)).toFixed(1)}`).join('');
      return up + dn + 'Z';
    };
    const zeroY = y(0).toFixed(1);
    const gridY = [hi, hi / 2].map(v =>
      `<line x1="0" x2="${W}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width=".5"/>`).join('');
    $('chart').innerHTML =
      gridY +
      `<path d="${area(d => Math.max(d.liq,0) + Math.max(d.iliq,0), d => Math.max(d.liq,0))}" fill="var(--iliq)" opacity=".55"/>` +
      `<path d="${area(d => d.liq, () => 0)}" fill="var(--liq)" opacity=".8"/>` +
      `<line x1="0" x2="${W}" y1="${zeroY}" y2="${zeroY}" stroke="var(--dim)" stroke-width=".75" stroke-dasharray="3 3"/>` +
      `<text x="2" y="${Math.max(y(hi) + 9, 9).toFixed(1)}" font-size="8" fill="var(--dim)">${fmt(hi)}</text>` +
      `<text x="2" y="${(H - 3).toFixed(1)}" font-size="8" fill="var(--dim)">age ${xs[0]}</text>` +
      `<text x="${W - 2}" y="${(H - 3).toFixed(1)}" font-size="8" fill="var(--dim)" text-anchor="end">${xs[xs.length-1]}</text>`;
  }

  $('chart').addEventListener('pointermove', e => {
    if (!cur) return;
    const r = e.currentTarget.getBoundingClientRect();
    const t = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1);
    const d = cur.series[Math.round(t * (cur.series.length - 1))];
    if (d) $('hover').textContent = `age ${d.age}: ${fmt(d.liq)} cash · ${fmt(d.iliq)} property`;
  });
  $('chart').addEventListener('pointerleave', () => { $('hover').textContent = ''; });

  // ── controls ──
  function applySaved() {
    $('sp').value = Math.min(Math.max(eff(saved) || 7000, 2000), 25000);
    $('yr').value = saved.yieldRate ?? 7;
    $('inf').value = saved.inflationRate ?? 3;
    $('ea').value = saved.endAge ?? 87;
    $('med').checked = saved.useMedianReturn !== false;
    $('cost').checked = !!(saved.sellCostRate || saved.propertyTaxRate);
    render(false);
  }
  ['sp','yr','inf','ea'].forEach(id => $(id).addEventListener('input', () => render(false)));
  ['med','cost'].forEach(id => $(id).addEventListener('change', () => render(true)));
  $('reset').addEventListener('click', applySaved);

  $('link').addEventListener('click', async () => {
    try {
      const url = location.origin + location.pathname + '#s=' + encodeURIComponent(await pack(readControls()));
      if (navigator.share) { await navigator.share({ title: 'Futuro', url }); $('msg').textContent = 'Shared.'; return; }
      await navigator.clipboard.writeText(url);
      $('msg').textContent = 'Link copied — open it on your phone.';
    } catch (e) { $('msg').innerHTML = '<span class="err">Could not create link: ' + e.message + '</span>'; }
    setTimeout(() => { $('msg').textContent = ''; }, 4000);
  });

  // ── go ──
  ready.then(async () => {
    await loadScenario();
    $('scen').textContent = source.length > 34 ? source.slice(0, 33) + '…' : source;
    $('src').textContent = 'Scenario from ' + source +
      '. Everything is simulated on this device with the same engine as the desktop app; ' +
      'the sliders never change your saved data.';
    applySaved();
  }).catch(e => {
    fail('Engine unavailable', e.message + ' — open this page from the same site as index.html.');
    $('src').textContent = '';
  });
})();
</script>
</body>
</html>
